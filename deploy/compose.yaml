name: rpa-console
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?required}
      RECOVERY_MAX_REQUESTS: ${RECOVERY_MAX_REQUESTS:-0}
      RECOVERY_MAX_TOKENS: ${RECOVERY_MAX_TOKENS:-0}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?required}
      PUBLIC_URL: ${PUBLIC_URL:?required}
      FEISHU_APP_ID: ${FEISHU_APP_ID:?required}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?required}
      FEISHU_TENANT_KEY: ${FEISHU_TENANT_KEY:?required}
      ADMIN_OPEN_IDS: ${ADMIN_OPEN_IDS:?required}
      EVIDENCE_DIR: /data/evidence
      ARTIFACT_DIR: /data/artifacts
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes: [evidence:/data/evidence, artifacts:/data/artifacts]
    networks: [default, database]
    restart: unless-stopped
  publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: ["uv", "run", "--no-sync", "python", "-m", "rpa_console.publisher"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?required}
      ARTIFACT_DIR: /data/artifacts
      GIT_KNOWN_HOSTS_FILE: /data/git/known_hosts
    volumes: [artifacts:/data/artifacts, git_config:/data/git]
    networks: [default, database]
    depends_on: [backend]
    restart: unless-stopped
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      target: agent
    environment:
      BACKEND_URL: http://backend:8000
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?required}
      RECOVERY_MAX_REQUESTS: ${RECOVERY_MAX_REQUESTS:-0}
      RECOVERY_MAX_TOKENS: ${RECOVERY_MAX_TOKENS:-0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?required}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash-vision-exp}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-none}
      PI_SESSION_DIR: /data/sessions
    volumes: [sessions:/data/sessions]
    depends_on: [backend]
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.node
      target: web
    # Host HTTPS proxy on Linux; ngrok on the Mac test server.
    ports: ["127.0.0.1:${WEB_PORT:-8088}:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  artifacts:
  git_config:
  evidence:
  sessions:
networks:
  database:
    external: true
    name: ${POSTGRES_NETWORK:?set existing Docker network in deploy/.env}
